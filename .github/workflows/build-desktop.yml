# The "press play" build: produces all three desktop installers in parallel.
#
#   macOS runner   -> Rollfilm-<ver>-arm64.dmg
#   Windows runner -> Rollfilm Setup <ver>.exe (NSIS)
#   Linux runner   -> Rollfilm-<ver>.AppImage
#
# Trigger it from the GitHub UI: Actions -> "Build desktop installers" ->
# "Run workflow" (or push a v* tag). The installers appear as downloadable
# artifacts on the run page.
name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which installers to build"
        type: choice
        default: all
        options: [all, macos, windows, linux]
  push:
    tags: ["v*"]

# Needed so the build can create the release and upload the installers to it,
# and so a tag build can read how CI went for its commit.
permissions:
  contents: write
  actions: read

jobs:
  # Cheap ubuntu job that turns the platform choice into the build matrix -
  # lets a single failed platform be rebuilt without re-running the others
  # (the macOS runner burns private-repo minutes at a 10x multiplier).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      # Full history and every tag: the release notes below are the commit
      # subjects since the previous tag, and a shallow clone knows neither the
      # previous tag nor the commits between.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is only built from a commit the tests passed on. The tag is
      # pushed together with main, so CI for that commit is running right now:
      # wait for it, and stop here - before a release exists - unless it comes
      # out green. (v0.1.85 was built and published while its CI run was red.)
      # A run started by hand is not held up: that is the way to rebuild one
      # platform, or to build anyway.
      - name: Wait for CI on this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            RESULT="$(gh run list --repo "${{ github.repository }}" --workflow CI \
              --commit "${{ github.sha }}" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)"
            case "$RESULT" in
              "completed success")
                echo "CI passed for ${{ github.sha }}."
                exit 0;;
              completed*)
                echo "::error::CI did not pass for ${{ github.sha }} ($RESULT). Nothing is built. Once CI is green for this commit (re-run it), re-run this workflow; if it took a fix, tag the fixed commit as a new version."
                exit 1;;
            esac
            echo "CI for ${{ github.sha }}: ${RESULT:-no run yet} - waiting ($i/120)"
            sleep 15
          done
          echo "::error::No CI result for ${{ github.sha }} after 30 minutes. Is the tag on a commit that was pushed to main?"
          exit 1

      # Linux builds on the OLDEST Ubuntu runner, not ubuntu-latest: PyInstaller
      # bundles the build host's Python and system libraries, and those need
      # at least the glibc they were linked against. Built on 24.04 the
      # AppImage asked for glibc 2.38 and would not start on anything older;
      # built on 22.04 it asks for 2.35.
      - id: m
        run: |
          case "${{ github.event.inputs.platform || 'all' }}" in
            macos)   echo 'matrix=["macos-latest"]' >> "$GITHUB_OUTPUT";;
            windows) echo 'matrix=["windows-latest"]' >> "$GITHUB_OUTPUT";;
            linux)   echo 'matrix=["ubuntu-22.04"]' >> "$GITHUB_OUTPUT";;
            *)       echo 'matrix=["macos-latest","windows-latest","ubuntu-22.04"]' >> "$GITHUB_OUTPUT";;
          esac

      # Create (once, up front) the release the build jobs upload into. Release
      # assets do NOT count against the Actions artifact-storage quota, so this
      # sidesteps the "storage quota has been hit" upload failure entirely.
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="desktop-${{ github.run_id }}"
          fi

          # The release page is where a downloader lands, so it should say what
          # changed. It can: the commit subjects in this project are already
          # user-readable sentences - that is the whole point of the commit
          # convention - so the changelog is simply the subjects since the
          # previous tag. The trailing "; 0.1.46" comes off because the version
          # is already the title.
          STRIP='s/;[[:space:]]*(bump to[[:space:]]+)?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$//'
          NOTES="$RUNNER_TEMP/notes.md"
          TITLE="Desktop installers ($TAG)"
          {
            if [ "${{ github.ref_type }}" = "tag" ]; then
              PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
              if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
              git log --format='%s' --no-merges "$RANGE" | sed -E "$STRIP" | sed 's/^/- /'
              TITLE="$TAG — $(git log -1 --format='%s' "$TAG" | sed -E "$STRIP")"
            else
              echo "Unreleased build from ${{ github.sha }}."
            fi
            echo
            echo "---"
            echo
            echo "Installers for macOS, Windows and Linux are below. They are not code-signed —"
            echo "macOS and Windows each say so in their own way, and the one-time way past it is"
            echo "in the [README](https://github.com/${{ github.repository }}#download--installation)."
            echo "Every installer has a \`.sha256\` file beside it if you want to verify the download."
          } > "$NOTES"

          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file "$NOTES" --prerelease
          # Also on a re-run, where the release already existed: the notes are
          # rebuilt from git every time rather than frozen at first creation.
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --title "$TITLE" --notes-file "$NOTES"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # NOT setup-python on macOS: its Python builds ship a sqlite3 without
      # loadable-extension support, and the backend needs enable_load_extension
      # for sqlite-vec — the packaged app would crash on startup. Homebrew's
      # Python is built with extension loading enabled.
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"

      - name: Install Python 3.11 (Homebrew, macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.11
          echo "$(brew --prefix python@3.11)/libexec/bin" >> "$GITHUB_PATH"

      - name: Create backend venv (with CPU torch + PyInstaller)
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          # Always go through `python -m pip`: on Windows the pip.exe shim
          # can't replace itself during `pip install --upgrade pip`.
          if [ "$RUNNER_OS" = "Windows" ]; then PY=".venv/Scripts/python"; else PY=".venv/bin/python"; fi
          # Fail the build right here if this Python can't load sqlite
          # extensions — shipping it would produce an app whose backend
          # crashes on launch (sqlite-vec is loaded on every DB connection).
          "$PY" -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True); print('sqlite3 extension loading: OK')"
          "$PY" -m pip install --upgrade pip
          # CPU-only torch: much smaller than the CUDA default on Linux/Windows.
          # On macOS the regular PyPI wheels are already CPU/MPS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$PY" -m pip install torch torchvision
          else
            "$PY" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          "$PY" -m pip install -e . pyinstaller

      # zsyncmake writes the .zsync that AppImage update tools download first;
      # scripts/appimage-update-info.js refuses to build a release without it.
      - name: Install zsync (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsync

      - name: Build installer
        run: node build-desktop.js

      # The installers are unsigned, so nothing in the OS vouches for them.
      # A published SHA-256 is the only way a downloader can tell a good
      # download from a corrupted or tampered one - and the Homebrew cask
      # reads the dmg's hash from here instead of re-downloading 384 MB.
      - name: Checksum installers
        shell: bash
        run: |
          shopt -s nullglob
          files=(electron/dist-app/*.dmg electron/dist-app/*.exe electron/dist-app/*.AppImage)
          node scripts/checksum.js "${files[@]}"

      # Upload straight to the GitHub Release (not an Actions artifact), so the
      # artifact-storage quota can never block delivery. Download the installers
      # from the release page. --clobber lets a re-run of one platform replace it.
      - name: Publish installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          # latest*.yml + blockmaps are what the in-app auto-updater
          # (electron-updater) reads to discover and delta-download a release;
          # the .zsync is the same thing for AppImage update tools.
          files=(electron/dist-app/*.dmg electron/dist-app/*.exe electron/dist-app/*.AppImage
                 electron/dist-app/latest*.yml electron/dist-app/*.blockmap
                 electron/dist-app/*.zsync electron/dist-app/*.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer found in electron/dist-app/"
            exit 1
          fi
          gh release upload "${{ needs.plan.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
