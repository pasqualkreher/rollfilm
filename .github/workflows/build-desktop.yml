# The "press play" build: produces all three desktop installers in parallel.
#
#   macOS runner   -> Photo Manager-<ver>-arm64.dmg
#   Windows runner -> Photo Manager Setup <ver>.exe (NSIS)
#   Linux runner   -> Photo Manager-<ver>.AppImage
#
# Trigger it from the GitHub UI: Actions -> "Build desktop installers" ->
# "Run workflow" (or push a v* tag). The installers appear as downloadable
# artifacts on the run page.
name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create backend venv (with CPU torch + PyInstaller)
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PIP=".venv/Scripts/pip"; else PIP=".venv/bin/pip"; fi
          "$PIP" install --upgrade pip
          # CPU-only torch: much smaller than the CUDA default on Linux/Windows.
          # On macOS the regular PyPI wheels are already CPU/MPS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$PIP" install torch torchvision
          else
            "$PIP" install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          "$PIP" install -e . pyinstaller

      - name: Build installer
        run: node build-desktop.js

      - uses: actions/upload-artifact@v4
        with:
          name: photo-manager-${{ runner.os }}
          if-no-files-found: error
          path: |
            electron/dist-app/*.dmg
            electron/dist-app/*.exe
            electron/dist-app/*.AppImage
