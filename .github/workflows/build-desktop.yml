# The "press play" build: produces all three desktop installers in parallel.
#
#   macOS runner   -> Photo Manager-<ver>-arm64.dmg
#   Windows runner -> Photo Manager Setup <ver>.exe (NSIS)
#   Linux runner   -> Photo Manager-<ver>.AppImage
#
# Trigger it from the GitHub UI: Actions -> "Build desktop installers" ->
# "Run workflow" (or push a v* tag). The installers appear as downloadable
# artifacts on the run page.
name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which installers to build"
        type: choice
        default: all
        options: [all, macos, windows, linux]
  push:
    tags: ["v*"]

# Needed so the build can create the release and upload the installers to it.
permissions:
  contents: write

jobs:
  # Cheap ubuntu job that turns the platform choice into the build matrix -
  # lets a single failed platform be rebuilt without re-running the others
  # (the macOS runner burns private-repo minutes at a 10x multiplier).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - id: m
        run: |
          case "${{ github.event.inputs.platform || 'all' }}" in
            macos)   echo 'matrix=["macos-latest"]' >> "$GITHUB_OUTPUT";;
            windows) echo 'matrix=["windows-latest"]' >> "$GITHUB_OUTPUT";;
            linux)   echo 'matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT";;
            *)       echo 'matrix=["macos-latest","windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT";;
          esac

      # Create (once, up front) the release the build jobs upload into. Release
      # assets do NOT count against the Actions artifact-storage quota, so this
      # sidesteps the "storage quota has been hit" upload failure entirely.
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="desktop-${{ github.run_id }}"
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Desktop installers ($TAG)" \
              --notes "Automated desktop build from ${{ github.sha }}." \
              --prerelease
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # NOT setup-python on macOS: its Python builds ship a sqlite3 without
      # loadable-extension support, and the backend needs enable_load_extension
      # for sqlite-vec — the packaged app would crash on startup. Homebrew's
      # Python is built with extension loading enabled.
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"

      - name: Install Python 3.11 (Homebrew, macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.11
          echo "$(brew --prefix python@3.11)/libexec/bin" >> "$GITHUB_PATH"

      - name: Create backend venv (with CPU torch + PyInstaller)
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          # Always go through `python -m pip`: on Windows the pip.exe shim
          # can't replace itself during `pip install --upgrade pip`.
          if [ "$RUNNER_OS" = "Windows" ]; then PY=".venv/Scripts/python"; else PY=".venv/bin/python"; fi
          # Fail the build right here if this Python can't load sqlite
          # extensions — shipping it would produce an app whose backend
          # crashes on launch (sqlite-vec is loaded on every DB connection).
          "$PY" -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True); print('sqlite3 extension loading: OK')"
          "$PY" -m pip install --upgrade pip
          # CPU-only torch: much smaller than the CUDA default on Linux/Windows.
          # On macOS the regular PyPI wheels are already CPU/MPS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$PY" -m pip install torch torchvision
          else
            "$PY" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          "$PY" -m pip install -e . pyinstaller

      - name: Build installer
        run: node build-desktop.js

      # Upload straight to the GitHub Release (not an Actions artifact), so the
      # artifact-storage quota can never block delivery. Download the installers
      # from the release page. --clobber lets a re-run of one platform replace it.
      - name: Publish installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(electron/dist-app/*.dmg electron/dist-app/*.exe electron/dist-app/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer found in electron/dist-app/"
            exit 1
          fi
          gh release upload "${{ needs.plan.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
