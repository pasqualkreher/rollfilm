services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - LIBRARY_ROOT=${LIBRARY_ROOT:-/data/library}
      - DB_PATH=${DB_PATH:-/data/db/library.db}
      - IMPORT_STAGING_ROOT=${IMPORT_STAGING_ROOT:-/data/staging}
      - THUMBNAIL_CACHE_ROOT=${THUMBNAIL_CACHE_ROOT:-/data/thumbnails}
      - MODEL_CACHE_ROOT=${MODEL_CACHE_ROOT:-/data/models}
      - CLIP_MODEL_NAME=${CLIP_MODEL_NAME:-ViT-B-32}
      - CLIP_MODEL_PRETRAINED=${CLIP_MODEL_PRETRAINED:-laion2b_s34b_b79k}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
    volumes:
      - ${HOST_LIBRARY_PATH:-./data/library}:/data/library
      - ${HOST_DB_PATH:-./data/db}:/data/db
      - ${HOST_STAGING_PATH:-./data/staging}:/data/staging
      - ${HOST_THUMBNAIL_PATH:-./data/thumbnails}:/data/thumbnails
      - ${HOST_MODEL_CACHE_PATH:-./data/models}:/data/models
      # External photo sources scanned in place (e.g. a NAS or an existing photo
      # folder). Mount host folders under /sources, then register them in
      # Settings -> External photo sources (path e.g. /sources/nas-photos).
      # Mounted read-only so the app can never modify or delete your originals.
      # Point HOST_SOURCES_PATH at your collection, or add more read-only lines
      # like `- /mnt/nas/photos:/sources/nas:ro`.
      - ${HOST_SOURCES_PATH:-./data/sources}:/sources:ro
      # Broad read-only mount so you can browse & pick ANY mounted drive/NAS
      # straight from the app (Settings -> External photo sources -> Browse),
      # without editing this file per source. On macOS external drives and NAS
      # shares live under /Volumes (already shared by Docker Desktop); on Linux
      # set HOST_BROWSE_PATH to /mnt, /media, or / as appropriate. Read-only, so
      # originals can never be modified. It appears inside the app as /hostfs.
      - ${HOST_BROWSE_PATH:-/Volumes}:/hostfs:ro
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
