<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rollfilm</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #4f8cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #status {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="84" height="84" viewBox="0 0 512 512" aria-hidden="true">
        <rect x="0" y="0" width="512" height="512" rx="116" fill="#f8f8f9"/>
        <rect x="240" y="146" width="102" height="200" rx="8" fill="#232f52"/>
        <rect x="300" y="146" width="152" height="102" rx="20" fill="#232f52"/>
        <rect x="300" y="146" width="80" height="64" fill="#232f52"/>
        <rect x="342" y="248" width="30" height="52" fill="#232f52"/>
        <circle cx="402" cy="290" r="50" fill="#f8f8f9"/>
        <g fill="#f8f8f9">
          <rect x="268" y="158" width="20" height="20" rx="4"/>
          <rect x="310" y="158" width="20" height="20" rx="4"/>
          <rect x="352" y="158" width="20" height="20" rx="4"/>
          <rect x="394" y="158" width="20" height="20" rx="4"/>
        </g>
        <rect x="146" y="62" width="44" height="46" rx="6" fill="#232f52"/>
        <rect x="82" y="96" width="180" height="44" rx="10" fill="#232f52"/>
        <rect x="82" y="372" width="180" height="44" rx="10" fill="#232f52"/>
        <rect x="92" y="124" width="160" height="264" rx="8" fill="#e8912a"/>
      </svg>
      <div class="spinner"></div>
      <h1>Rollfilm</h1>
      <p id="status">Loading…</p>
    </div>
  </body>
</html>
