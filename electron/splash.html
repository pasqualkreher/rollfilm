<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Photo Manager</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #4f8cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #status {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <h1>Photo Manager</h1>
      <p id="status">Starting…</p>
    </div>
  </body>
</html>
