<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rollfilm</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #4f8cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #status {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="72" height="72" viewBox="0 0 512 512" aria-hidden="true">
        <rect x="0" y="0" width="512" height="512" rx="116" fill="#17181a"/>
        <rect x="170" y="176" width="290" height="160" rx="24" fill="#e89129"/>
        <g fill="#17181a">
          <rect x="240" y="192" width="26" height="18" rx="5"/>
          <rect x="288" y="192" width="26" height="18" rx="5"/>
          <rect x="336" y="192" width="26" height="18" rx="5"/>
          <rect x="384" y="192" width="26" height="18" rx="5"/>
          <rect x="240" y="302" width="26" height="18" rx="5"/>
          <rect x="288" y="302" width="26" height="18" rx="5"/>
          <rect x="336" y="302" width="26" height="18" rx="5"/>
          <rect x="384" y="302" width="26" height="18" rx="5"/>
        </g>
        <rect x="300" y="228" width="126" height="56" rx="8" fill="#17181a" opacity="0.22"/>
        <circle cx="170" cy="256" r="120" fill="#e89129"/>
        <circle cx="170" cy="256" r="66" fill="#17181a"/>
        <circle cx="170" cy="256" r="22" fill="#e89129"/>
      </svg>
      <div class="spinner"></div>
      <h1>Rollfilm</h1>
      <p id="status">Loading…</p>
    </div>
  </body>
</html>
