<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rollfilm</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #4f8cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #status {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Inline copy of frontend/public/rollfilm.svg (X-Pro1-style camera) —
           keep in sync when the logo changes. -->
      <svg width="84" height="84" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="116" fill="#f8f8f9"/>
        <rect x="368" y="128" width="56" height="34" rx="11" fill="#1e1e23"/>
        <circle cx="334" cy="148" r="13" fill="#4a4a55"/>
        <rect x="52" y="158" width="408" height="232" rx="52" fill="#1e1e23"/>
        <rect x="88" y="186" width="88" height="52" rx="14" fill="#f8f8f9"/>
        <circle cx="300" cy="286" r="96" fill="#34343d"/>
        <circle cx="300" cy="286" r="70" fill="#b9bec9"/>
        <circle cx="300" cy="286" r="56" fill="#1e1e23"/>
        <circle cx="300" cy="286" r="42" fill="#3d4d78"/>
        <circle cx="284" cy="270" r="13" fill="#f8f8f9" opacity="0.9"/>
      </svg>
      <div class="spinner"></div>
      <h1>Rollfilm</h1>
      <p id="status">Loading…</p>
    </div>
  </body>
</html>
