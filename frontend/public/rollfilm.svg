<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rollfilm logo: a classic rangefinder camera (Leica-style silver top
       plate, navy body, orange lens ring as the brand accent). Flat shapes
       only so it still reads at 20px in the top bar. Painter's algorithm:
       navy body, light top plate squared off at its bottom edge, windows,
       then the lens drawn over both. -->
  <rect width="512" height="512" rx="116" fill="#f8f8f9"/>
  <!-- top controls: rewind knob, shutter dial, orange shutter release -->
  <rect x="92" y="120" width="54" height="50" rx="12" fill="#232f52"/>
  <rect x="382" y="120" width="46" height="50" rx="12" fill="#232f52"/>
  <circle cx="350" cy="146" r="15" fill="#e8912a"/>
  <!-- body -->
  <rect x="52" y="158" width="408" height="232" rx="44" fill="#232f52"/>
  <!-- silver top plate (second rect squares off the rounded bottom corners) -->
  <rect x="52" y="158" width="408" height="74" rx="44" fill="#c6ccdb"/>
  <rect x="52" y="188" width="408" height="44" fill="#c6ccdb"/>
  <!-- rangefinder + viewfinder windows -->
  <rect x="302" y="176" width="20" height="34" rx="6" fill="#232f52"/>
  <rect x="344" y="172" width="76" height="42" rx="10" fill="#232f52"/>
  <!-- lens: orange ring, barrel, glass, highlight -->
  <circle cx="222" cy="288" r="98" fill="#e8912a"/>
  <circle cx="222" cy="288" r="70" fill="#232f52"/>
  <circle cx="222" cy="288" r="46" fill="#45568c"/>
  <circle cx="204" cy="270" r="15" fill="#f8f8f9" opacity="0.9"/>
</svg>
