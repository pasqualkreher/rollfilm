<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rollfilm logo: a rangefinder camera in the style of a Fujifilm X-Pro1.
       All-black body with rounded corners, big hybrid-viewfinder window at
       the top left, lens centre-right with a silver accent ring and blue
       coated glass. Flat shapes only so it still reads at 20px in the top
       bar. This file is the single source of truth: favicon and top-bar logo
       use it directly, electron/build/icon.png is rendered from it. -->
  <rect width="512" height="512" rx="116" fill="#f8f8f9"/>
  <!-- top plate: shutter speed dial + shutter release, flat like the X-Pro1 -->
  <rect x="368" y="128" width="56" height="34" rx="11" fill="#1e1e23"/>
  <circle cx="334" cy="148" r="13" fill="#4a4a55"/>
  <!-- body -->
  <rect x="52" y="158" width="408" height="232" rx="52" fill="#1e1e23"/>
  <!-- hybrid viewfinder window, top left -->
  <rect x="88" y="186" width="88" height="52" rx="14" fill="#f8f8f9"/>
  <!-- lens: dark barrel, silver accent ring, blue coated glass, highlight -->
  <circle cx="300" cy="286" r="96" fill="#34343d"/>
  <circle cx="300" cy="286" r="70" fill="#b9bec9"/>
  <circle cx="300" cy="286" r="56" fill="#1e1e23"/>
  <circle cx="300" cy="286" r="42" fill="#3d4d78"/>
  <circle cx="284" cy="270" r="13" fill="#f8f8f9" opacity="0.9"/>
</svg>
