[project]
name = "photo-manager-backend"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pasqual Kreher" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1",
    "rawpy>=0.21",
    "Pillow>=10.4",
    "ImageHash>=4.3",
    "PyExifTool>=0.5.6",
    "sqlite-vec>=0.1.3",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.10",
    "open_clip_torch>=2.26",
    # Semantic mask subjects (sky/water/...): SegFormer-B0 on ADE20K, ~14MB of
    # weights fetched lazily into the model cache on first use.
    "transformers>=4.44",
    "reverse_geocoder>=1.5",
    # CA bundle the frozen build falls back to: the OpenSSL inside the OpenCV
    # wheel looks for its build machine's trust store, which no user has.
    "certifi>=2024.7.4",
    "pycountry>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

# So a contributor can just run `pytest` from this folder. Without testpaths it
# also walks pyi-dist/ - the PyInstaller output, which contains a vendored copy
# of torch's own test suite and fails collection outright. pythonpath saves
# everyone the PYTHONPATH=. that importing `app` would otherwise need.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
